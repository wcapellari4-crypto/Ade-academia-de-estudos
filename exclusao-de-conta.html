<main>

<h1>🗑️ Exclusão de Conta</h1>

<p><b>ADE — Academia de Estudos</b></p>

<p>
Nesta página você pode solicitar a exclusão da sua conta e dos dados associados.
</p>

<form action="mailto:wcapellari4@gmail.com" method="post" enctype="text/plain">

<label>E-mail utilizado no cadastro:</label>
<input type="email" name="email" required>

<label>Mensagem:</label>
<textarea name="mensagem" rows="6">Solicito a exclusão da minha conta e dos dados associados na ADE — Academia de Estudos.</textarea>

<button type="submit">ENVIAR SOLICITAÇÃO</button>

</form>

<p>
Também é possível excluir os dados diretamente pela opção
<b>“Excluir conta e dados”</b> dentro do aplicativo.
</p>

<p>Contato: <b>wcapellari4@gmail.com</b></p>
